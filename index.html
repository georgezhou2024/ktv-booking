    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
        }
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        img { -webkit-user-drag: none; pointer-events: none; }
        body {
            padding: 18px;
            color: #f3e9e2;
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.45) 100%),
                url("ph.jpg") center center / cover no-repeat;
            background-attachment: fixed;
        }
        /* 门店专属背景 */
        body.bg-acme {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.55) 40%, rgba(20,10,5,0.85) 100%),
                url("https://georgezhou2024.github.io/ktv-booking/MAC-2026-In-The-Studio-Chp-2-Anyroad-16x9-initial.avif") top center / cover no-repeat;
            background-attachment: fixed;
        }
        body.bg-phroom {
            background: linear-gradient(180deg, #1a1a1f 0%, #2d2d33 40%, #1f1f24 100%);
            background-attachment: fixed;
        }
        body.bg-eros {
            background: linear-gradient(180deg, #3d1a2a 0%, #5c2a40 40%, #2e1520 100%);
            background-attachment: fixed;
        }
        body.bg-sensory {
            background: linear-gradient(180deg, #2a2418 0%, #3d3525 40%, #1f1a10 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        /* ========== 门店选择页面 ========== */
        .store-select-container {
            max-width: 1200px;
            margin: 15vh auto 0;
            text-align: center;
        }
        .store-select-title {
            font-size: 38px;
            font-style: italic;
            letter-spacing: 6px;
            color: #fff8f3;
            margin-bottom: 50px;
        }
        .store-select-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .store-btn {
            padding: 45px 50px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-width: 260px;
        }
        .store-btn:hover {
            background: linear-gradient(140deg, #a06544, #7d4b30);
            border-color: #ddb89f;
        }
        .store-btn p {
            font-size: 13px;
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* ========== 返回按钮 ========== */
        .back-bar {
            max-width: 1140px;
            margin: 0 auto 10px;
        }
        .back-btn {
            padding: 8px 18px;
            background: rgba(112, 66, 43, 0.6);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: rgba(160, 101, 68, 0.8);
        }

        /* ========== 通用酒水单样式 ========== */
        .page-title {
            text-align: center;
            font-size: 44px;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 4px;
            color: #fff8f3;
            margin-bottom: 4px;
        }
        .page-title::before,
        .page-title::after {
            content: "";
            display: inline-block;
            width: 18px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ddb89f, transparent);
            vertical-align: middle;
            margin: 0 12px;
        }
        .page-subtitle {
            text-align: center;
            font-size: 14px;
            color: #ddc9bc;
            margin-bottom: 26px;
            letter-spacing: 2px;
        }
        .divider-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #b88c6e, transparent);
            margin-bottom: 24px;
        }
        .card {
            background: rgba(255,252,248,0.94);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            border: 1px solid #a0785e;
            color: #3b2216;
        }
        h2 {
            border-left: 6px solid #804c30;
            padding-left: 14px;
            margin-bottom: 18px;
            font-size: 22px;
            color: #522f1d;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px dashed #d4c4ba;
            gap: 14px;
            flex-wrap: wrap;
        }
    .item:last-child {
            border-bottom: none;
        }
        .name {
            flex: 1;
            font-size: 15px;
        }
        .name .en-name {
            display: block;
            font-size: 11.5px;
            color: #8a7a68;
            font-weight: 400;
            margin-top: 2px;
        }
        .sub-text {
            font-size: 12px;
            color: #745746;
            margin-top: 3px;
            line-height: 1.4;
        }
        .price {
            font-weight: 700;
            color: #992c22;
            white-space: nowrap;
            font-size: 15px;
        }
        .flag {
            display: inline-block;
            margin-right: 7px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            vertical-align: -3px;
            object-fit: cover;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(142px, 1fr));
            gap: 13px;
            margin-bottom: 24px;
        }
        .cat-btn {
            padding: 15px 8px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 14px rgba(0,0,0,0.3);
        }
        .cat-btn:hover {
            background: linear-gradient(140deg, #a06544, #7d4b30);
        }
        .cat-btn.active {
            background: linear-gradient(140deg, #a06544, #7d4b30);
            box-shadow: 0 0 0 2px rgba(219,174,142,0.45), 0 9px 22px rgba(120,65,35,0.4);
            border-color: #ddb89f;
        }
        .cat-page {
            display: none;
        }
        .cat-page.active {
            display: block;
        }
        .notice-block {
            background: #f7efea;
            padding: 16px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: #442a1b;
        }
        .footer-note {
            text-align: center;
            color: #c9b3a4;
            font-size: 13px;
            margin-top: 32px;
            letter-spacing: 2px;
        }
        .card-tip {
            font-size: 12px;
            color: #745746;
            margin-top: 12px;
            text-align: right;
        }

        /* ========== SENSORY GARDEN 专属复古烫金风格 ========== */
        .theme-sensory .card {
            background: #f8f1e4;
            border: none;
            border-radius: 0;
            padding: 40px 36px;
            position: relative;
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
            color: #4a3826;
        }
        /* 四角花纹边框 */
        .theme-sensory .card::before,
        .theme-sensory .card::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card::before {
            top: 8px;
            left: 8px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card::after {
            top: 8px;
            right: 8px;
            transform: scaleX(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card .card-bottom-left,
        .theme-sensory .card .card-bottom-right {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 8px;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card .card-bottom-left {
            left: 8px;
            transform: scaleY(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card .card-bottom-right {
            right: 8px;
            transform: scale(-1, -1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        /* 上下装饰线 */
        .theme-sensory .card .card-top-line,
        .theme-sensory .card .card-bottom-line {
            position: absolute;
            left: 140px;
            right: 140px;
            height: 20px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card .card-top-line {
            top: 12px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 20' fill='none' stroke='%23b8945a' stroke-width='1.2'><path d='M0 10 Q200 0 400 10 Q600 20 800 10'/></svg>");
        }
        .theme-sensory .card .card-bottom-line {
            bottom: 12px;
            transform: scaleY(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 20' fill='none' stroke='%23b8945a' stroke-width='1.2'><path d='M0 10 Q200 0 400 10 Q600 20 800 10'/></svg>");
        }
        .theme-sensory h2 {
            border: none;
            text-align: center;
            color: #a67c3d;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 3px;
            padding: 0 0 20px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #d4c0a3;
        }
        .theme-sensory h2::after {
            content: attr(data-cn);
            display: block;
            font-size: 18px;
            color: #8b6b43;
            margin-top: 4px;
            letter-spacing: 6px;
        }
        .theme-sensory .item {
            border-bottom: 1px dashed #d4c0a3;
            padding: 16px 0;
        }
        .theme-sensory .name {
            font-size: 18px;
            color: #4a3826;
            font-weight: 500;
        }
        .theme-sensory .name .en-name {
            display: block;
            font-size: 14px;
            color: #947a58;
            margin-top: 4px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .theme-sensory .price {
            color: #a67c3d;
            font-size: 18px;
            font-weight: 600;
        }
        .theme-sensory .card-tip {
            text-align: center;
            color: #8b6b43;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        .theme-sensory .notice-block {
            background: transparent;
            color: #5a4630;
        }
        /* SENSORY 分类按钮配色 */
        .theme-sensory .cat-btn {
            background: linear-gradient(140deg, #8b6b43, #6b5030);
            border-color: #a67c3d;
        }
        .theme-sensory .cat-btn:hover {
            background: linear-gradient(140deg, #a67c3d, #8b6b43);
        }
        .theme-sensory .cat-btn.active {
            background: linear-gradient(140deg, #c9a56b, #a67c3d);
            border-color: #e0c48d;
            box-shadow: 0 0 0 2px rgba(201,165,107,0.4), 0 9px 22px rgba(107,80,48,0.4);
        }

        @media (max-width: 620px) {
            .page-title { font-size: 30px; }
            .card { padding: 18px; }
            .item { flex-direction: column; padding: 13px 0; }
            .price { margin-top: 5px; }
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .store-btn { padding: 35px 40px; font-size: 18px; min-width: auto; }
            .theme-sensory .card { padding: 30px 20px; }
            .theme-sensory .card::before,
            .theme-sensory .card::after,
            .theme-sensory .card .card-bottom-left,
            .theme-sensory .card .card-bottom-right {
                width: 80px;
                height: 80px;
            }
            .theme-sensory .card .card-top-line,
            .theme-sensory .card .card-bottom-line {
                left: 90px;
                right: 90px;
            }
        }
    /* 沽清/售尽样式 */
    .item.sold-out{opacity:.55;filter:grayscale(.5);}
    .item.sold-out .name{text-decoration:line-through;text-decoration-color:rgba(255,80,80,.7);}
    .sold-badge{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:9px;background:#b3242a;color:#fff;font-size:11px;font-weight:600;letter-spacing:1px;vertical-align:middle;}
    </style>
</head>

<script>
// WebP 全局兜底：任何 .webp 图片加载失败（老浏览器/文件缺失）自动回退同名 .jpg
document.addEventListener('error', function(e){
  var t = e.target;
  if(t && t.tagName === 'IMG' && /\.webp(\?.*)?$/i.test(t.getAttribute('src') || '') && !t.dataset.fb){
    t.dataset.fb = '1';
    t.src = t.getAttribute('src').replace(/\.webp(\?.*)?$/i, '.jpg');
  }
}, true);
// ========== 门店酒水单数据 ==========
let STORE_DATA = {};
let STORE_LIST = []; // 门店清单（data/stores.json，由 /admin 后台维护，新增门店自动出现）
let FLAGS_SETTINGS = {hideAll:false,overrides:{}};

function autoFlag(zh, en){
  const t=(zh||'')+' '+(en||'');
  for(const [re,fg] of FLAG_RULES) if(re.test(t)) return fg;
  for(const [pat,fg] of BRAND_FLAGS){ try{ if(new RegExp(pat,'i').test(t)) return fg; }catch(e){} }
  if(/Chablis|Bordeaux|Burgundy|Rhone|Champagne|Cognac|Provence/i.test(en||'')) return '🇫🇷';
  if(/Marlborough/i.test(en||'')) return '🇳🇿';
  if(/Napa|California/i.test(en||'')) return '🇺🇸';
  if(/Chianti|Tuscany|Piemonte|Prosecco/i.test(en||'')) return '🇮🇹';
  if(/Rioja|Priorato/i.test(en||'')) return '🇪🇸';
  if(/Margaret River|Barossa/i.test(en||'')) return '🇦🇺';
  if(/Mendoza/i.test(en||'')) return '🇦🇷';
  return '';
}

// 渲染分类后：给品名前面插国旗
function decorateFlags(root, sk, catId){
  if(!root) return;
  if(FLAGS_SETTINGS.hideAll) return;
  (root.querySelectorAll('.item .name')||[]).forEach(function(nameEl){
    if(nameEl.querySelector('.flag')) return;
    const zh = (nameEl.childNodes[0] && nameEl.childNodes[0].nodeType===3 ? nameEl.childNodes[0].textContent : nameEl.textContent).trim();
    if(/^¥.*卡/.test(zh)) return; // 会员充值卡不出旗
    const en = (nameEl.querySelector('.en-name')||{}).textContent||'';
    const key = sk+'|'+catId+'|'+zh;
    let fg = FLAGS_SETTINGS.overrides[key];
    if(fg===undefined) fg = autoFlag(zh,en);
    if(!fg || fg==='hide'){
      // 没有规则：联网维基百科查一次，结果缓存
      lookupFlag(zh, en).then(function(found){
        if(!found) return;
        if(nameEl.querySelector('.flag')) return;
        const uri=flagDataUri(found); if(!uri) return;
        const img=document.createElement('img');
        img.className='flag'; img.src=uri; img.alt=found; img.width=15; img.height=15;
        nameEl.insertBefore(img, nameEl.childNodes[0]);
      });
      return;
    }
    const uri=flagDataUri(fg);
    if(!uri) return;
    const img=document.createElement('img');
    img.className='flag'; img.src=uri; img.alt=fg; img.width=15; img.height=15;
    nameEl.insertBefore(img, nameEl.childNodes[0]);
  });
}
// ========== 菜单数据加载（版本号缓存：仅 version.txt 每次校验，数据文件走浏览器强缓存，弱网秒开） ==========
let MENU_VER = localStorage.getItem('ph_menu_ver') || '';
async function refreshMenuVersion(){
  try{
    const r = await fetch('data/version.txt?x=' + Date.now(), {cache:'no-store'});
    if(r.ok){ const v = (await r.text()).trim(); if(v){ MENU_VER = v; localStorage.setItem('ph_menu_ver', v); } }
  }catch(e){ /* 弱网/离线：沿用本地缓存版本 */ }
}
async function fetchMenuJSON(path){
  if(MENU_VER){
    try{ return await (await fetch(path + '?v=' + MENU_VER)).json(); }catch(e){}
  }
  return await (await fetch(path)).json();
}
const DATA_READY = (async function(){
  try{
    await refreshMenuVersion();
    STORE_LIST = await fetchMenuJSON('data/stores.json');
    await Promise.all(STORE_LIST.filter(function(m){return !m.hidden;}).map(async function(m){
      STORE_DATA[m.key] = await fetchMenuJSON('data/' + m.key + '.json');
    }));
    SHISHA_CONTENT = await fetchMenuJSON('data/shisha.json');
    try{ FLAGS_SETTINGS = await fetchMenuJSON('data/flags.json'); }catch(e){ FLAGS_SETTINGS = {hideAll:false,overrides:{}}; }
    renderStoreButtons();
    window.__dataReady = true;
    var bm = document.getElementById('boot-mask'); if(bm) bm.remove();
  }catch(e){
    var bm2 = document.getElementById('boot-mask');
    if(bm2){ bm2.querySelector('.bm-txt').textContent = '菜单数据加载失败，请检查网络后刷新'; }
    console.error('菜单数据加载失败', e);
  }
})();

// 根据门店清单动态渲染门店按钮
function renderStoreButtons(){
    document.getElementById('store-buttons').innerHTML = STORE_LIST.filter(function(m){return !m.hidden;}).map(function(m){
        return '<button class="store-btn" onclick="enterStore(\'' + m.key + '\')">' + m.name + '<p>' + (m.sub || '') + '</p></button>';
    }).join('');
}


// ========== 页面切换逻辑 ==========
let currentStore = null;

function enterStore(storeKey) {
    if(!window.__dataReady){ DATA_READY.then(function(){ enterStore(storeKey); }); return; }
    currentStore = storeKey;
    const data = STORE_DATA[storeKey];
    
    // 切换门店专属背景
    document.body.className = 'bg-' + storeKey;
    
    // 切换页面显示
    document.getElementById('store-select-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    
    // 设置主题类
    const container = document.getElementById('main-container');
    container.className = 'container ' + (data.theme || '');
    
    // 设置标题文案
    document.getElementById('store-title').textContent = data.name;
    document.getElementById('store-subtitle').textContent = data.subtitle;
    document.getElementById('store-footer').textContent = data.footer;
    
    // 渲染分类按钮
    renderTabs(data);
    // 默认进入主页面分类网格（首项为房间/水烟等全屏板块时，不直接进入）
    const firstCat = visibleCats(data)[0];
    if (!firstCat) { showHome(); }
    else if (firstCat.id === 'rooms' || firstCat.id === 'shisha') {
        showHome();
    } else {
        showCat(firstCat.id);
    }
}

// 主页面：只显示分类网格，不进入任何分类
function showHome() {
    document.getElementById('menu-tabs').style.display = '';
    document.getElementById('store-footer').style.display = '';
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('menu-content').innerHTML =
        '<div style="text-align:center;padding:70px 20px;opacity:0.4;font-size:13px;letter-spacing:4px;">请 选 择 分 类</div>';
    window.scrollTo(0, 0);
}

function backToStore() {
    currentStore = null;
    document.body.className = '';
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('store-select-page').style.display = 'block';
}

// 渲染分类标签（后台隐藏的分类不显示）
function renderTabs(data) {
    const tabsContainer = document.getElementById('menu-tabs');
    const visible = data.categories.filter(c => !c.hidden);
    tabsContainer.innerHTML = visible.map(cat =>
        `<button class="cat-btn" data-id="${cat.id}" onclick="showCat('${cat.id}')">${cat.name}</button>`
    ).join('');
}
function visibleCats(data){ return data.categories.filter(c => !c.hidden); }

// 切换分类
function showCat(catId) {
    const data = STORE_DATA[currentStore];

    // 房间、水烟为全屏独立板块：隐藏主分类网格与页脚，像独立主页
    const isSubSection = catId === 'rooms' || catId === 'shisha';
    document.getElementById('menu-tabs').style.display = isSubSection ? 'none' : '';
    document.getElementById('store-footer').style.display = isSubSection ? 'none' : '';

    // 切换按钮高亮
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.id === catId) btn.classList.add('active');
    });

    // 切换内容
    document.getElementById('menu-content').innerHTML = data.content[catId];
    decorateFlags(document.getElementById('menu-content'), currentStore, catId);
    window.scrollTo(0, 0);
}

// 从房间/水烟全屏板块返回主页面分类网格
function backToCategories() {
    showHome();
}
function showAbout(){
    var root=document.getElementById('about-page');
    root.style.display='block';
    document.body.style.overflow='hidden';
    // 覆盖层初始隐藏，原生 lazy 不触发；用 IntersectionObserver 滚动到才加载
    if(!window.__aboutIO){
        window.__aboutIO=new IntersectionObserver(function(entries){
            entries.forEach(function(en){
                if(en.isIntersecting){
                    var im=en.target, ds=im.getAttribute('data-src');
                    if(ds){
                        im.onerror=function(){ this.onerror=null; this.src=ds.replace(/\.webp$/,'.jpg'); };
                        im.src=ds; im.removeAttribute('data-src');
                    }
                    window.__aboutIO.unobserve(im);
                }
            });
        },{root:root,rootMargin:'800px 0px'});
    }
    root.querySelectorAll('img[data-src]').forEach(function(im){ window.__aboutIO.observe(im); });
}
function hideAbout(){
    document.getElementById('about-page').style.display='none';
    document.body.style.overflow='';
}

function showRoom(src, name) {
    document.getElementById('rl-view').style.display = 'none';
    document.getElementById('rd-view').style.display = 'block';
    document.getElementById('rd-title').textContent = name;
    var roomImg = document.getElementById('rd-img');
    roomImg.dataset.fb = '';
    roomImg.onerror = function(){ if(!this.dataset.fb){ this.dataset.fb = '1'; this.onerror = null; this.src = src; } };
    roomImg.src = /\.(jpe?g|png)$/i.test(src) ? src.replace(/\.(jpe?g|png)$/i, '.webp') : src;
    window.scrollTo(0, 0);
}
function backToRooms() {
    document.getElementById('rd-view').style.display = 'none';
    document.getElementById('rl-view').style.display = 'block';
    window.scrollTo(0, 0);
}

function openRoom(src){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:99999;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;';
    overlay.onclick = function(){ document.body.removeChild(overlay); };
    var img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'width:100%;max-width:600px;';
    overlay.appendChild(img);
    document.body.appendChild(overlay);
}

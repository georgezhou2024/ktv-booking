<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒水单 - 门店选择</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
        }
        body {
            padding: 18px;
            color: #f3e9e2;
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.45) 100%),
                url("ph.jpg") center center / cover no-repeat;
            background-attachment: fixed;
        }
        /* 门店专属背景 */
        body.bg-acme {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.55) 40%, rgba(20,10,5,0.85) 100%),
                url("https://georgezhou2024.github.io/ktv-booking/MAC-2026-In-The-Studio-Chp-2-Anyroad-16x9-initial.avif") top center / cover no-repeat;
            background-attachment: fixed;
        }
        body.bg-phroom {
            background: linear-gradient(180deg, #1a1a1f 0%, #2d2d33 40%, #1f1f24 100%);
            background-attachment: fixed;
        }
        body.bg-eros {
            background: linear-gradient(180deg, #3d1a2a 0%, #5c2a40 40%, #2e1520 100%);
            background-attachment: fixed;
        }
        body.bg-sensory {
            background: linear-gradient(180deg, #2a2418 0%, #3d3525 40%, #1f1a10 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        /* ========== 门店选择页面 ========== */
        .store-select-container {
            max-width: 1200px;
            margin: 15vh auto 0;
            text-align: center;
        }
        .store-select-title {
            font-size: 38px;
            font-style: italic;
            letter-spacing: 6px;
            color: #fff8f3;
            margin-bottom: 50px;
        }
        .store-select-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .store-btn {
            padding: 45px 50px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-width: 260px;
        }
        .store-btn:hover {
            background: linear-gradient(140deg, #a06544, #7d4b30);
            border-color: #ddb89f;
        }
        .store-btn p {
            font-size: 13px;
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* ========== 返回按钮 ========== */
        .back-bar {
            max-width: 1140px;
            margin: 0 auto 10px;
        }
        .back-btn {
            padding: 8px 18px;
            background: rgba(112, 66, 43, 0.6);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: rgba(160, 101, 68, 0.8);
        }

        /* ========== 通用酒水单样式 ========== */
        .page-title {
            text-align: center;
            font-size: 44px;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 4px;
            color: #fff8f3;
            margin-bottom: 4px;
        }
        .page-title::before,
        .page-title::after {
            content: "";
            display: inline-block;
            width: 18px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ddb89f, transparent);
            vertical-align: middle;
            margin: 0 12px;
        }
        .page-subtitle {
            text-align: center;
            font-size: 14px;
            color: #ddc9bc;
            margin-bottom: 26px;
            letter-spacing: 2px;
        }
        .divider-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #b88c6e, transparent);
            margin-bottom: 24px;
        }
        .card {
            background: rgba(255,252,248,0.94);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            border: 1px solid #a0785e;
            color: #3b2216;
        }
        h2 {
            border-left: 6px solid #804c30;
            padding-left: 14px;
            margin-bottom: 18px;
            font-size: 22px;
            color: #522f1d;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px dashed #d4c4ba;
            gap: 14px;
            flex-wrap: wrap;
        }
        .item:last-child {
            border-bottom: none;
        }
        .name {
            flex: 1;
            font-size: 15px;
        }
        .sub-text {
            font-size: 12px;
            color: #745746;
            margin-top: 3px;
            line-height: 1.4;
        }
        .price {
            font-weight: 700;
            color: #992c22;
            white-space: nowrap;
            font-size: 15px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(142px, 1fr));
            gap: 13px;
            margin-bottom: 24px;
        }
        .cat-btn {
            padding: 15px 8px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 14px rgba(0,0,0,0.3);
        }
        .cat-btn:hover {
            background: linear-gradient(140deg, #a06544, #7d4b30);
        }
        .cat-btn.active {
            background: linear-gradient(140deg, #a06544, #7d4b30);
            box-shadow: 0 0 0 2px rgba(219,174,142,0.45), 0 9px 22px rgba(120,65,35,0.4);
            border-color: #ddb89f;
        }
        .cat-page {
            display: none;
        }
        .cat-page.active {
            display: block;
        }
        .notice-block {
            background: #f7efea;
            padding: 16px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: #442a1b;
        }
        .footer-note {
            text-align: center;
            color: #c9b3a4;
            font-size: 13px;
            margin-top: 32px;
            letter-spacing: 2px;
        }
        .card-tip {
            font-size: 12px;
            color: #745746;
            margin-top: 12px;
            text-align: right;
        }

        /* ========== SENSORY GARDEN 专属复古烫金风格 ========== */
        .theme-sensory .card {
            background: #f8f1e4;
            border: none;
            border-radius: 0;
            padding: 40px 36px;
            position: relative;
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
            color: #4a3826;
        }
        /* 四角花纹边框 */
        .theme-sensory .card::before,
        .theme-sensory .card::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card::before {
            top: 8px;
            left: 8px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card::after {
            top: 8px;
            right: 8px;
            transform: scaleX(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card .card-bottom-left,
        .theme-sensory .card .card-bottom-right {
            position: absolute;
            width: 120px;
            height: 120px;
            bottom: 8px;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card .card-bottom-left {
            left: 8px;
            transform: scaleY(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        .theme-sensory .card .card-bottom-right {
            right: 8px;
            transform: scale(-1, -1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23b8945a' stroke-width='1.5'><path d='M0 30 C0 10 20 0 40 0 L60 0 C60 20 50 35 35 45 C20 55 10 70 10 90 L10 120'/><path d='M30 0 C50 0 65 15 75 30 C85 45 90 60 90 80 L90 110'/><circle cx='75' cy='25' r='4'/><path d='M15 50 Q30 40 45 50 Q30 60 15 50Z'/></svg>");
        }
        /* 上下装饰线 */
        .theme-sensory .card .card-top-line,
        .theme-sensory .card .card-bottom-line {
            position: absolute;
            left: 140px;
            right: 140px;
            height: 20px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        .theme-sensory .card .card-top-line {
            top: 12px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 20' fill='none' stroke='%23b8945a' stroke-width='1.2'><path d='M0 10 Q200 0 400 10 Q600 20 800 10'/></svg>");
        }
        .theme-sensory .card .card-bottom-line {
            bottom: 12px;
            transform: scaleY(-1);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 20' fill='none' stroke='%23b8945a' stroke-width='1.2'><path d='M0 10 Q200 0 400 10 Q600 20 800 10'/></svg>");
        }
        .theme-sensory h2 {
            border: none;
            text-align: center;
            color: #a67c3d;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 3px;
            padding: 0 0 20px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #d4c0a3;
        }
        .theme-sensory h2::after {
            content: attr(data-cn);
            display: block;
            font-size: 18px;
            color: #8b6b43;
            margin-top: 4px;
            letter-spacing: 6px;
        }
        .theme-sensory .item {
            border-bottom: 1px dashed #d4c0a3;
            padding: 16px 0;
        }
        .theme-sensory .name {
            font-size: 18px;
            color: #4a3826;
            font-weight: 500;
        }
        .theme-sensory .name .en-name {
            display: block;
            font-size: 14px;
            color: #947a58;
            margin-top: 4px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .theme-sensory .price {
            color: #a67c3d;
            font-size: 18px;
            font-weight: 600;
        }
        .theme-sensory .card-tip {
            text-align: center;
            color: #8b6b43;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        .theme-sensory .notice-block {
            background: transparent;
            color: #5a4630;
        }
        /* SENSORY 分类按钮配色 */
        .theme-sensory .cat-btn {
            background: linear-gradient(140deg, #8b6b43, #6b5030);
            border-color: #a67c3d;
        }
        .theme-sensory .cat-btn:hover {
            background: linear-gradient(140deg, #a67c3d, #8b6b43);
        }
        .theme-sensory .cat-btn.active {
            background: linear-gradient(140deg, #c9a56b, #a67c3d);
            border-color: #e0c48d;
            box-shadow: 0 0 0 2px rgba(201,165,107,0.4), 0 9px 22px rgba(107,80,48,0.4);
        }

        @media (max-width: 620px) {
            .page-title { font-size: 30px; }
            .card { padding: 18px; }
            .item { flex-direction: column; padding: 13px 0; }
            .price { margin-top: 5px; }
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .store-btn { padding: 35px 40px; font-size: 18px; min-width: auto; }
            .theme-sensory .card { padding: 30px 20px; }
            .theme-sensory .card::before,
            .theme-sensory .card::after,
            .theme-sensory .card .card-bottom-left,
            .theme-sensory .card .card-bottom-right {
                width: 80px;
                height: 80px;
            }
            .theme-sensory .card .card-top-line,
            .theme-sensory .card .card-bottom-line {
                left: 90px;
                right: 90px;
            }
        }
    </style>
</head>
<body>

<!-- ========== 门店选择页面 ========== -->
<div id="store-select-page" class="store-select-container">
    <h1 class="store-select-title">请选择门店</h1>
    <div class="store-select-buttons">
        <button class="store-btn" onclick="enterStore('acme')">
            ACME
            <p>Meet me at Acme</p>
        </button>
        <button class="store-btn" onclick="enterStore('phroom')">
            PH ROOM
            <p>PH ROOM</p>
        </button>
        <button class="store-btn" onclick="enterStore('eros')">
            EROS LIVE SHOW
            <p>Fall in Love. Fall into Play.</p>
        </button>
        <button class="store-btn" onclick="enterStore('sensory')">
            SENSORY GARDEN
            <p>森三里</p>
        </button>
    </div>
</div>

<!-- ========== 酒水单主页面 ========== -->
<div id="main-page" style="display: none;">
    <div class="back-bar">
        <button class="back-btn" onclick="backToStore()">← 返回门店选择</button>
    </div>
    <div class="container" id="main-container">

        <p class="page-subtitle" id="store-subtitle">Meet me at Acme — Drink List</p>
        <div class="divider-line"></div>

        <div class="menu-grid" id="menu-tabs">
            <!-- JS动态生成分类按钮 -->
        </div>

        <div id="menu-content">
            <!-- JS动态生成分类内容 -->
        </div>

        <p class="footer-note" id="store-footer">— Meet me at Acme —</p>
    </div>
</div>

// ========== 页面切换逻辑 ==========
let currentStore = null;

function enterStore(storeKey) {
    currentStore = storeKey;
    const data = STORE_DATA[storeKey];
    
    // 切换门店专属背景
    document.body.className = 'bg-' + storeKey;
    
    // 切换页面显示
    document.getElementById('store-select-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    
    // 设置主题类
    const container = document.getElementById('main-container');
    container.className = 'container ' + (data.theme || '');
    
    // 设置标题文案
    document.getElementById('store-title').textContent = data.name;
    document.getElementById('store-subtitle').textContent = data.subtitle;
    document.getElementById('store-footer').textContent = data.footer;
    
    // 渲染分类按钮
    renderTabs(data);
    // 默认显示第一个分类
    showCat(data.categories[0].id);
}

function backToStore() {
    currentStore = null;
    document.body.className = '';
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('store-select-page').style.display = 'block';
}

// 渲染分类标签
function renderTabs(data) {
    const tabsContainer = document.getElementById('menu-tabs');
    tabsContainer.innerHTML = data.categories.map(cat => 
        `<button class="cat-btn" data-id="${cat.id}" onclick="showCat('${cat.id}')">${cat.name}</button>`
    ).join('');
}

// 切换分类
function showCat(catId) {
    const data = STORE_DATA[currentStore];
    
    // 切换按钮高亮
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.id === catId) btn.classList.add('active');
    });
    
    // 切换内容
    document.getElementById('menu-content').innerHTML = data.content[catId];
}
</script>

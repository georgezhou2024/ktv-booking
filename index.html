<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒水单 - 门店选择</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
        }
        body {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.55) 40%, rgba(20,10,5,0.85) 100%),
                url("https://georgezhou2024.github.io/ktv-booking/MAC-2026-In-The-Studio-Chp-2-Anyroad-16x9-initial.avif") top center / cover no-repeat;
            padding: 18px;
            color: #f3e9e2;
            min-height: 100vh;
        }
        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        /* ========== 门店选择页面 ========== */
        .store-select-container {
            max-width: 900px;
            margin: 15vh auto 0;
            text-align: center;
        }
        .store-select-title {
            font-size: 38px;
            font-style: italic;
            letter-spacing: 6px;
            color: #fff8f3;
            margin-bottom: 50px;
            animation: acmeBreath 4.2s ease-in-out infinite;
        }
        .store-select-buttons {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .store-btn {
            padding: 50px 70px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 16px;
            font-size: 26px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }
        .store-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            background: linear-gradient(140deg, #a06544, #7d4b30);
            border-color: #ddb89f;
        }
        .store-btn p {
            font-size: 14px;
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        /* ========== 返回按钮 ========== */
        .back-bar {
            max-width: 1140px;
            margin: 0 auto 10px;
        }
        .back-btn {
            padding: 8px 18px;
            background: rgba(112, 66, 43, 0.6);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(160, 101, 68, 0.8);
        }

        /* ========== 原有酒水单样式 ========== */
        .page-title {
            text-align: center;
            font-size: 44px;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 4px;
            color: #fff8f3;
            margin-bottom: 4px;
            animation: acmeBreath 4.2s ease-in-out infinite;
        }
        .page-title::before,
        .page-title::after {
            content: "";
            display: inline-block;
            width: 18px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ddb89f, transparent);
            vertical-align: middle;
            margin: 0 12px;
            animation: linePulse 4.2s ease-in-out infinite;
        }
        .page-subtitle {
            text-align: center;
            font-size: 14px;
            color: #ddc9bc;
            margin-bottom: 26px;
            letter-spacing: 2px;
            animation: subtitleFloat 5s ease-in-out infinite;
        }
        .divider-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #b88c6e, transparent);
            margin-bottom: 24px;
        }
        .card {
            background: rgba(255,252,248,0.94);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            border: 1px solid #a0785e;
            color: #3b2216;
        }
        h2 {
            border-left: 6px solid #804c30;
            padding-left: 14px;
            margin-bottom: 18px;
            font-size: 22px;
            color: #522f1d;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px dashed #d4c4ba;
            gap: 14px;
            flex-wrap: wrap;
        }
        .item:last-child {
            border-bottom: none;
        }
        .name {
            flex: 1;
            font-size: 15px;
        }
        .sub-text {
            font-size: 12px;
            color: #745746;
            margin-top: 3px;
            line-height: 1.4;
        }
        .price {
            font-weight: 700;
            color: #992c22;
            white-space: nowrap;
            font-size: 15px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(142px, 1fr));
            gap: 13px;
            margin-bottom: 24px;
        }
        .cat-btn {
            padding: 15px 8px;
            background: linear-gradient(140deg, #70422b, #502e1d);
            color: #fff8f3;
            border: 1px solid #966d54;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 14px rgba(0,0,0,0.3);
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }
        .cat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.38);
        }
        .cat-btn.active {
            background: linear-gradient(140deg, #a06544, #7d4b30);
            box-shadow: 0 0 0 2px rgba(219,174,142,0.45), 0 9px 22px rgba(120,65,35,0.4);
            border-color: #ddb89f;
        }
        .cat-page {
            display: none;
        }
        .cat-page.active {
            display: block;
            animation: fadeIn 0.28s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes acmeBreath {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 210, 160, 0.35);
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 24px rgba(255, 210, 160, 0.75);
            }
        }
        @keyframes subtitleFloat {
            0%, 100% { transform: translateY(0); opacity: 0.85; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
        @keyframes linePulse {
            0%, 100% { opacity: 0.4; width: 18px; }
            50% { opacity: 1; width: 32px; }
        }
        .notice-block {
            background: #f7efea;
            padding: 16px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: #442a1b;
        }
        .footer-note {
            text-align: center;
            color: #c9b3a4;
            font-size: 13px;
            margin-top: 32px;
            letter-spacing: 2px;
        }
        @media (max-width: 620px) {
            .page-title { font-size: 30px; }
            .card { padding: 18px; }
            .item { flex-direction: column; padding: 13px 0; }
            .price { margin-top: 5px; }
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .store-btn { padding: 40px 50px; font-size: 22px; }
        }
    </style>
</head>

<div id="store-select-page" class="store-select-container">

</div>

// ========== 页面切换逻辑 ==========
let currentStore = null;

function enterStore(storeKey) {
    currentStore = storeKey;
    const data = STORE_DATA[storeKey];
    
    // 切换页面显示
    document.getElementById('store-select-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    
    // 设置标题文案
    document.getElementById('store-title').textContent = data.name;
    document.getElementById('store-subtitle').textContent = data.subtitle;
    document.getElementById('store-footer').textContent = data.footer;
    
    // 渲染分类按钮
    renderTabs(data);
    // 默认显示第一个分类
    showCat(data.categories[0].id);
}

function backToStore() {
    currentStore = null;
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('store-select-page').style.display = 'block';
}

// 渲染分类标签
function renderTabs(data) {
    const tabsContainer = document.getElementById('menu-tabs');
    tabsContainer.innerHTML = data.categories.map(cat => 
        `<button class="cat-btn" data-id="${cat.id}" onclick="showCat('${cat.id}')">${cat.name}</button>`
    ).join('');
}

// 切换分类
function showCat(catId) {
    const data = STORE_DATA[currentStore];
    
    // 切换按钮高亮
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.id === catId) btn.classList.add('active');
    });
    
    // 切换内容
    document.getElementById('menu-content').innerHTML = data.content[catId];
    
    // 添加active类保持动画
    const content = document.getElementById('menu-content');
    content.classList.remove('active');
    void content.offsetWidth; // 触发重绘
    content.classList.add('active');
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTV包厢预订管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>KTV包厢预订管理系统</h1>

    <!-- 新增预订表单 -->
    <div class="card">
        <h2>新增预订</h2>
        <form id="bookForm">
            <div class="row">
                <div>
                    <label>门店</label>
                    <select id="store" required>
                        <option value="">请选择门店</option>
                        <option>PH CLUB</option>
                        <option>ERO ROOM</option>
                        <option>ACME</option>
                        <option>WOOD</option>
                        <option>SENSORY GARDEN</option>
                        <option>LUST</option>
                    </select>
                </div>
                <div>
                    <label>客户姓名</label>
                    <input type="text" id="name" required oninput="autoFillCustomer()">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>联系方式</label>
                    <input type="text" id="phone">
                </div>
                <div>
                    <label>预订日期</label>
                    <input type="date" id="bookDate" required>
                </div>
            </div>
            <div class="row">
                <div>
                    <label>包厢</label>
                    <input type="text" id="room" placeholder="小包/中包/大包/VIP/卡座">
                </div>
                <div>
                    <label>时段</label>
                    <input type="text" id="timeSlot" placeholder="下午场/黄金场/夜场">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>到场人数</label>
                    <input type="number" id="people" min="1">
                </div>
                <div>
                    <label>低消</label>
                    <input type="text" id="minConsume" placeholder="低消金额">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>金额</label>
                    <input type="number" id="price" min="0" step="0.01">
                </div>
                <div></div>
            </div>
            <label>备注（押金、客户需求、到店时间）</label>
            <textarea id="remark" rows="3" placeholder="押金、预留小吃、客户偏好等"></textarea>
            <button type="submit">保存预订</button>
        </form>
    </div>

    <!-- 搜索筛选 -->
    <div class="card">
        <input type="text" id="searchInput" placeholder="搜索客户姓名 / 包厢 / 门店">
        <input type="date" id="filterDate">
        <button onclick="renderList()">筛选</button>
        <button onclick="exportData()">导出预订备份</button>
        <button onclick="exportCustomerData()">导出客户档案</button>
    </div>

    <!-- 预订列表 -->
    <div class="card">
        <h2>预订列表（自动隐藏已过期预约）</h2>
        <table>
            <thead>
                <tr>
                    <th>门店</th>
                    <th>预订日期</th>
                    <th>客户</th>
                    <th>包厢</th>
                    <th>时段</th>
                    <th>人数</th>
                    <th>低消</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
